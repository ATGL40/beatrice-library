[package]
name = "beatrice"
version = "0.2.1"
description = "碧翠子禁书库 · Beatrice Library"
authors = ["Beatrice Library"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name from clashing with the bin name on Windows.
name = "beatrice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
